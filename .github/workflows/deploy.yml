name: Deploy to GitHub Pages

# The site is served from hajin-lee.com by Cloudflare, so this no longer
# runs on a push: two hosts publishing the same commit is duplicate content,
# and the copy this workflow builds claims github.io as its own canonical.
#
# It is kept, and kept working, because it is the way back. Running it by
# hand republishes jinontheclock.github.io/Portfolio from whatever main is
# at; restoring the push trigger below returns the site to GitHub Pages
# entirely. Nothing else has to change — GitHub Actions sets neither
# CF_PAGES nor WORKERS_CI, so this build picks the /Portfolio/ base and the
# github.io canonical on its own.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a deploy that is already publishing. Two pushes a minute
  # apart would otherwise kill the first mid-upload and leave the live site
  # on the older build with both runs reporting done.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # No --base here on purpose: vite.config.js decides the base and the
      # absolute URLs from SITE_DOMAIN, CF_PAGES or public/CNAME, and prints
      # what it picked. See docs/deploy-runbook.md.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # The Pages deploy service fails transiently now and then with the
      # build green; one automatic retry has cleared every case so far.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
