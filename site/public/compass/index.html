<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Compass — concept demo</title>
    <!-- FF Meta, served from the Adobe Fonts kit. The font files are
         licensed and are never committed here.

         The kit needs no domain list: Adobe dropped Typekit's per-kit domain
         allowlist when web projects replaced kits, and the project page says
         so itself ("embed this project on any website you manage"). Moving
         host needs nothing done here.

         What the kit does have to keep is the weights the demo asks for:
         ff-meta-web-pro at 400, 500 (Book), 600 (Medium) and 700 (Bold),
         roman only. Trimming any of those leaves the browser to snap or
         synthesise them, which is visible — the type scale is what chapter
         05 of the case study is about. Condensed, correspondence and the
         italics are in the kit but unused. -->
    <link rel="stylesheet" href="https://use.typekit.net/aqa6xjt.css" />
    <!-- installable: the manifest and icons let a phone keep the demo on its
         home screen and open it full-bleed, the way the app is meant to sit -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="module" crossorigin src="./assets/index-C4o8VRUM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BCY7DC8k.css">
  </head>
