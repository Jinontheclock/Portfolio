<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Each page sets its own document.title once it is on screen; this one
         is the default a crawler and the first paint get. -->
    <title>HAJIN, Product Designer</title>
    <meta
      name="description"
      content="Hajin Lee — Product Designer in Vancouver, BC. Case studies in product design, design systems, and front-end development: Compass Card, WeLAB, ProLog, TinyPaws."
    />
    <meta name="author" content="Hajin Lee" />
    <link rel="canonical" href="%SITE_URL%" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HAJIN" />
    <meta property="og:title" content="HAJIN, Product Designer" />
    <!-- No og:description or twitter:description, deliberately. The card is
         meant to be the image, the page's title and the domain, and nothing
         else; a paragraph under a title that already says the same thing
         only made it longer. The meta description below stays — that one is
         the search result's snippet, and dropping it hands Google a
         sentence of its own choosing from the page body. -->
    <meta property="og:url" content="%SITE_URL%" />
    <!-- The URL stays absolute: OG crawlers do not resolve relative paths, so
         a move to a custom domain has to bring these two with it.

         The filename carries a version. Messengers cache a link's image hard
         and iMessage and KakaoTalk offer no way to force a re-fetch, so a new
         card overwriting the old filename would keep showing the old picture
         for days. A new name is fetched immediately. Bump it again for the
         next one rather than overwriting this file. -->
    <meta property="og:image" content="%SITE_URL%og-image-v3.png" />
    <meta property="og:image:width" content="3600" />
    <meta property="og:image:height" content="1890" />
    <meta
      property="og:image:alt"
      content="HAJIN, Product Designer."
    />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="ko_KR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HAJIN, Product Designer" />
    <meta name="twitter:image" content="%SITE_URL%og-image-v3.png" />

    <!-- Icons. The base token is filled in with the deploy's base, so these
         hold whether the site is served from a project path or a domain root.

         The SVG is listed first and, in any browser that reads it, it wins
         outright: given an SVG icon a browser prefers it over every raster
         size offered, so the .ico below is what the ones that cannot read
         SVG fall back to. The two therefore have to stay the same artwork.

         site.webmanifest is what hands the two larger icons to Android —
         without it a home-screen install finds neither. Its own paths are
         relative to itself, which is how it survives the same move between
         a project path and a domain root that %BASE_URL% handles here. -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#FAFAFA" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
